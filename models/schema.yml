version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: products
        identifier: raw_gz_product
        description: "Normalized products view"
        columns:
          - name: products_id
            description: "ID of the products"
            tests:
              - not_null
          - name: purchase_price
            description: "Prices of the products"
            tests:
              - unique
              - not_null
        tests:
          - unique:
              column_name: 'products_id || purchase_price'

      - name: sales
        identifier: raw_gz_sales
        description: "Includes raw sales data"
        columns:
          - name: date_date
            description: "Date of the sales"
            tests:
              - not_null
          - name: orders_id
            description: "ID of the order"
            tests:
              - not_null
          - name: products_id
            description: "ID of the product"
            tests:
              - not_null
          - name: revenue
            description: "Revenue of the sales"
            tests:
              - not_null
          - name: quantity
            description: "Quantity of the products that sold"
            tests:
              - not_null
        tests:
          - unique:
              column_name: 'date_date || orders_id || products_id || revenue || quantity'

      - name: shipping
        identifier: raw_gz_ship
        description: "Includes raw ship data"
        columns:
          - name: orders_id
            description: "ID of the order"
            tests:
              - not_null
          - name: ship
            description: "Fee of the shipping"
            tests:
              - not_null
          - name: log_cost
            description: "Cost of the logistic"
            tests:
              - not_null
          - name: ship_cost
            description: "Cost of the shipping"
            tests:
              - unique
              - not_null
        tests:
          - unique:
              column_name: 'orders_id || shipping_fee || log_cost || ship_cost'

      - name: adwords
        identifier: raw_gz_adwords

      - name: bing
        identifier: raw_gz_bing        
      
      - name: criteo
        identifier: raw_gz_criteo

      - name: facebook
        identifier: raw_gz_facebook 

      - name: int_campaigns
        description: "All data from the campaigns"
        columns:
          - name: paid_source
            tests:
              - not_null
          - name: campaign_name
            tests:
              - not_null

      - name: finance_campaigns_day
        description: global KPI
        columns:
          - name: ads_margin
            description: "operational_margin - ads_cost"
            tests:
              - not_null
          - name: average_basket
            description: "Daily average basket"
            tests:
              - not_null

