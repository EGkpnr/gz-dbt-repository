version: 2

sources:
  - name: raw
    schema: raw_gz_data
    tables:
      - name: products
        identifier: raw_gz_products
        description: includes raw products data
        columns:
          - name: products_id
            description: id of the products
            tests:
              - not_null
          - name: purchSE_PRICE
            description: Prices of the products
            tests:
              - not_null
        tests:
          - unique:
              column_name: 'products_id || purchSE_PRICE'
      - name: sales
        identifier: raw_gz_sales
        description: includes raw sales data
        columns:
        - name: date_date
          description: Date of the sales
          tests:
            - not_null
        - name: orders_id
          description: ID of the order
          tests:
            - not_null
        - name: pdt_id
          description: ID of the product
          tests:
          - not_null
        tests:
          - unique:
              column_name: 'date_date || orders_id || pdt_id'
      - name: ship
        identifier: raw_gz_ship
        description: includes raw ship data
        columns:
        - name: orders_id
          description: ID of the order
          tests:
            - not_null
        - name: shipping_fee
          description: Fee of the shipping
          tests:
            - not_null
        - name: logCost
          description: Cost of the logistic
          tests:
          - not_null
        - name: ship_cost
          description: Cost of the shipping
          tests:
          - not_null
        tests:
          - unique:
              column_name: 'orders_id || shipping_fee || logCost || ship_cost'